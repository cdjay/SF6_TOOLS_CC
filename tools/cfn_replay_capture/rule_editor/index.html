<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SF6CC · 录像规则</title><link rel="icon" href="data:,"><link rel="stylesheet" href="editor.css"></head>
<body><header><div class="brand"><img id="brand-icon" alt="" width="30" height="30"><div><strong>SF6CC</strong><span>录像分析 / 规则工作台</span></div></div><div class="actions"><span class="badge">离线</span><button id="import">导入配置</button><button id="save-game">保存到游戏</button><button id="export" class="primary">导出配置 ↓</button></div></header>
<div class="workspace"><aside><div class="aside-title"><h1>分析规则</h1><button id="add" title="新建规则" aria-label="新建规则">＋</button></div><input id="search" type="search" placeholder="查找规则" aria-label="查找规则"><div id="rule-list"></div><div class="aside-bottom"><button id="templates">从系统分类创建</button><button id="reset">恢复默认配置</button></div></aside>
<main>
<section id="timeline-workbench" aria-label="录像时间线">
<div class="workbench-bar"><h2>录像工作台</h2><button id="capture-import">打开录像数据</button><button id="connect-game">连接游戏文件夹</button><button id="read-game">读取游戏数据</button><label class="inline"><input id="watch-game" type="checkbox">跟随游戏结果</label></div>
<div id="capture-status" role="status">尚未打开录像数据</div>
<div id="timeline-controls" hidden><div class="workbench-bar"><label>局数<select id="tl-round"></select></label><label>观察玩家<select id="tl-side"><option value="1">1P</option><option value="2">2P</option></select></label><label>录像帧<input id="tl-frame" type="number" step="1" min="0"></label><button id="tl-prev" title="前一帧" aria-label="前一帧">←</button><button id="tl-next" title="后一帧" aria-label="后一帧">→</button><button id="tl-prev-event" title="上一事件">上一事件</button><button id="tl-next-event" title="下一事件">下一事件</button><strong id="tl-position"></strong></div>
<canvas id="tl-canvas" height="90" aria-label="双方血量和事件时间线"></canvas><input id="tl-scrub" type="range" step="1" aria-label="当前录像帧"><div id="tl-summary"></div></div>
<div id="game-status" role="status"></div></section>
<div class="profile"><label>配置名称<input id="profile-name" maxlength="60"></label><div><small>游戏数据版本</small><strong id="build"></strong></div><div><small>自定义规则</small><strong id="rule-count">0</strong></div><label><input id="include-system" type="checkbox">包含系统规则</label></div>
<nav aria-label="编辑视图"><button data-tab="rules" class="active">规则编辑</button><button data-tab="facts">事实与指令</button><button data-tab="system">系统判定</button><button data-tab="settings">系统范围</button><button data-tab="fields">条件目录</button><button data-tab="json">配置文本</button></nav>
<section id="rules-view"><div id="empty"><h2>系统规则已启用</h2><p>自定义规则：0 条</p><button id="empty-add" class="primary">＋ 新建规则</button></div><div id="rule-detail" hidden></div><section id="sandbox" hidden><div class="section-heading"><h2>条件试算</h2><output id="match-result">未试算</output></div><div id="sample-values"></div><button id="run-sample">运行试算</button></section></section>
<section id="settings-view" hidden><h2>系统判断范围</h2><div id="settings"></div><p class="note">P0 仅用于人工确认。缺失数据不作为 0；未知条件取反后仍为未知。录像身份、同局定位与原始伤害统计不受规则修改影响。</p></section>
<section id="fields-view" hidden><div class="section-heading"><h2>条件目录</h2><input id="field-search" type="search" placeholder="搜索名称或字段" aria-label="搜索条件目录"></div><div id="field-directory"></div></section>
<section id="json-view" hidden><div class="section-heading"><h2>配置文本</h2><button id="apply-json">应用文本修改</button></div><textarea id="json-text" spellcheck="false" aria-label="配置文本"></textarea><p class="note">自定义配置是待核对建议，不是已确认结论。</p></section>
<section id="facts-view" hidden><div class="section-heading"><h2>当前帧事实</h2><input id="fact-search" type="search" placeholder="查找血量、斗气、动作…" aria-label="查找事实"></div><div id="frame-facts"></div><div class="players" id="input-histories"></div><details><summary>现代按键显示标注</summary><div id="modern-mapping"></div></details><div class="section-heading"><h2>本局事件</h2><select id="event-kind" aria-label="事件类型"><option value="all">受伤与防御</option><option value="damage">受伤</option><option value="guard">防御</option></select></div><div id="event-list"></div></section>
<section id="system-view" hidden><h2>当前系统判定</h2><div id="system-categories"></div><details><summary>完整判断代码（只读）</summary><pre id="system-source"></pre></details></section>
<section id="evidence-view" hidden><div class="section-heading"><h2 id="evidence-title">事件验证</h2><button id="event-rule">从此事件新建规则</button></div><div id="preview-status"></div><div id="evidence-fields"></div><div id="rule-trace"></div></section>
<div class="workbench-bar"><button id="request-feature">生成补充需求</button></div>
</main></div><footer><span id="status" role="status">系统规则 · 未修改</span><span id="validity"></span></footer>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<input type="file" id="capture-file" accept=".json,application/json" hidden>
<dialog id="feature-dialog"><div class="section-heading"><h2>补充分析能力</h2><button id="close-feature" aria-label="关闭补充需求">×</button></div><label>需要增加什么<textarea id="feature-description" rows="3"></textarea></label><button id="build-feature">整理当前证据</button><textarea id="feature-prompt" rows="12" readonly aria-label="给Codex的需求"></textarea><div class="workbench-bar"><button id="copy-feature">复制需求</button><button id="download-feature">导出需求</button></div><div id="feature-status" role="status"></div></dialog>
<dialog id="template-dialog"><div class="section-heading"><h2>系统分类</h2><button id="close-templates" aria-label="关闭">×</button></div><div id="template-list"></div></dialog>
<script src="catalog.js"></script><script src="model.js"></script><script src="game-files.js"></script><script src="editor.js"></script><script src="timeline-model.js"></script><script src="timeline.js"></script></body></html>
